logging:
  structured:
    format:
      console: ecs

spring:
  application:
    name: event-gateway

  datasource:
    url: jdbc:h2:mem:eventdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: 8080

account-service:
  base-url: ${ACCOUNT_SERVICE_BASE_URL:http://localhost:8081}

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health
      path-mapping:
        health: health

  endpoint:
    health:
      show-details: always